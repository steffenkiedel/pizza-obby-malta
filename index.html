<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pizza Obby Malta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1E88E5; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; }

    /* Landscape-Pflicht: Overlay erscheint automatisch im Portrait-Modus */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #1A3A6E;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      z-index: 9999;
      gap: 16px;
    }
    #rotate-overlay .icon {
      font-size: 64px;
      animation: spin 2s ease-in-out infinite;
    }
    #rotate-overlay h2 { font-size: 24px; }
    #rotate-overlay p  { font-size: 15px; opacity: 0.75; }

    @keyframes spin {
      0%   { transform: rotate(0deg);   }
      40%  { transform: rotate(90deg);  }
      100% { transform: rotate(90deg);  }
    }

    @media (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <h2>Handy drehen</h2>
    <p>Pizza Obby Malta läuft im Querformat</p>
  </div>
  <script src="phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
